name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE: ghcr.io/straplocked/3d-space-pong

jobs:
  gate:
    name: Typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Hard gate since 2026-10-01 (task 841): the suite ran green in CI on
      # cb849a6 and 1310396, so a failing test now stops `publish`.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: Browser tests (Playwright)
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Pinned to the exact @playwright/test version in package.json so the
    # bundled browser matches what `pnpm exec playwright test` expects.
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
      options: --ipc=host
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (Playwright runs against the built server + web bundle)
        run: pnpm build

      - name: Run Playwright suite
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  publish:
    name: Build & push image
    # NOTE (task 842): `e2e` intentionally is NOT in this list yet. It's a
    # new job — it needs to pass once in CI before it gates `publish`.
    # Flip this to `needs: [gate, e2e]` once that's happened.
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          sbom: false
          outputs: type=registry,oci-mediatypes=false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:git-${{ steps.sha.outputs.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/straplocked/3d-space-pong
