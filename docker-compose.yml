services:
  app:
    build: .
    image: 3d-space-pong:latest
    container_name: 3d-space-pong
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      DB_DRIVER: sqlite
      DB_URL: file:/app/data/pong.db
      PORT: 3000
      HOST: 0.0.0.0
      NODE_ENV: production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
