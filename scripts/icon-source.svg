<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="75%">
      <stop offset="0%" stop-color="#0a2614" />
      <stop offset="55%" stop-color="#020a04" />
      <stop offset="100%" stop-color="#000500" />
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-soft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Opaque full-bleed background so the icon works as a maskable PWA icon. -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bg)" />

  <!-- Faint scanlines, kept subtle so they read at 192px too. -->
  <g opacity="0.12">
    <rect x="0" y="96" width="512" height="2" fill="#00ff41" />
    <rect x="0" y="256" width="512" height="2" fill="#00ff41" />
    <rect x="0" y="416" width="512" height="2" fill="#00ff41" />
  </g>

  <!-- Motion trail behind the ball. -->
  <circle cx="252" cy="256" r="14" fill="#00e5ff" opacity="0.18" />
  <circle cx="280" cy="256" r="18" fill="#00e5ff" opacity="0.3" />

  <!-- Paddle (neon green), centered in the safe zone. -->
  <rect
    x="140" y="176" width="36" height="160" rx="18"
    fill="#00ff41"
    filter="url(#glow)"
  />

  <!-- Ball (neon cyan). -->
  <circle
    cx="340" cy="256" r="34"
    fill="#00e5ff"
    filter="url(#glow-soft)"
  />
</svg>
